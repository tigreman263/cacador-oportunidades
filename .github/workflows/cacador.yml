name: Caçador de Oportunidades

on:
  schedule:
    - cron: "*/15 * * * *"   # de 15 em 15 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para correr à mão

permissions:
  contents: write

concurrency:
  group: cacador
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar anúncios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_TELEFONE: ${{ secrets.WHATSAPP_TELEFONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python -m bot

      - name: Guardar resultados
        run: |
          git config user.name "cacador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json docs/localidades.json estado/estado.json
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "Verificação automática" -q
          # A página pode ter gravado o config.json entretanto: junta antes de enviar.
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
