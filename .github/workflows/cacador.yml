name: Caçador de Oportunidades
run-name: ${{ github.event_name == 'schedule' && 'automática (reserva do GitHub)' || (inputs.agendada && 'automática (despertador)' || (inputs.resumo && 'pedida no Telegram' || 'manual')) }}

# Quem acorda o bot de 15 em 15 minutos é o Worker do Cloudflare (extras/cloudflare/worker.js),
# que carrega no "Run workflow", porque o agendador do GitHub atrasa ou salta muitas execuções.
# O "schedule" abaixo é só reserva (1 vez por hora), para o bot não parar se o Worker falhar.
# Nas execuções automáticas o bot só vai aos sites se já passou o tempo escolhido na regra
# "De quanto em quanto tempo procurar" (intervalo_minutos); as manuais correm sempre.
on:
  schedule:
    - cron: "37 * * * *"     # reserva: 1 vez por hora, ao minuto 37
  workflow_dispatch:          # usado pelo Worker (agendada) e pelo botão "Run workflow"
    inputs:
      agendada:
        description: "Execução automática (respeita o intervalo das regras)"
        type: boolean
        default: false
      resumo:
        description: "Mandar resumo no Telegram no fim (botão Procurar agora)"
        type: boolean
        default: false
      teste_alerta:
        description: "Só enviar para o Telegram os anúncios de exemplo (para ver o aspeto)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cacador
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a primeira leitura da base do Drive pode demorar; depois é rápida
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cópia privada dos ficheiros da base do Drive (não vai para o repositório público).
      # Assim só se descarregam de novo os ficheiros que mudaram no Drive.
      - uses: actions/cache@v4
        with:
          path: estado/drive_cache
          key: drive-${{ github.run_id }}
          restore-keys: drive-

      - name: Verificar anúncios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_TELEFONE: ${{ secrets.WHATSAPP_TELEFONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GOOGLE_DRIVE_CHAVE: ${{ secrets.GOOGLE_DRIVE_CHAVE }}
        run: python -m bot ${{ (github.event_name == 'schedule' || inputs.agendada) && '--agendada' || '' }} ${{ inputs.resumo && '--resumo' || '' }} ${{ inputs.teste_alerta && '--teste-alerta' || '' }}

      - name: Guardar resultados
        run: |
          git config user.name "cacador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json docs/localidades.json estado/estado.json
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "Verificação automática" -q
          # A página pode ter gravado o config.json entretanto: junta antes de enviar.
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
